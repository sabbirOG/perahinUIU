<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIU Courses & Class Materials | Perahin UIU</title>
    <meta name="description" content="Browse all UIU courses, class materials, prerequisites, and resources for United International University students at Perahin UIU.">
    <meta name="keywords" content="UIU courses, UIU class materials, Perahin UIU, UIU course browser, United International University">
    <meta property="og:title" content="UIU Courses & Class Materials | Perahin UIU">
    <meta property="og:description" content="Browse all UIU courses, class materials, prerequisites, and resources for UIU students at Perahin UIU.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sabbirog.github.io/perahin-uiu/pages/courses.html">
    <meta property="og:image" content="../logo/logo-perahin-uiu-main.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/courses.css">
    <link rel="icon" href="../logo/logo-perahin-uiu-main.png">
    <meta name="theme-color" content="#FF6F00">
</head>
<body>
    <div class="background-wrapper"></div>
    <header class="topbar">
        <button id="backButton" class="icon-btn back-btn" aria-label="Back" title="Back"><span class="back-chev">‹</span></button>
        <a class="brand no-underline" href="../index.html">
            <img src="../logo/logo-perahin-uiu-main.png" alt="Perahin UIU" class="brand-logo">
            <span class="brand-name"><span class="brand-text">perahin</span><span class="brand-uiu">UIU</span></span>
        </a>
        <nav class="nav" id="navMenu">
            <a href="../index.html" class="nav-link">Dashboard</a>
            <a href="courses.html" class="nav-link active">Courses</a>
            <a href="notices.html" class="nav-link">Notices</a>
            <a href="events.html" class="nav-link">Events</a>
            <a href="messages.html" class="nav-link">Messages</a>
            <a href="resources.html" class="nav-link">Resources</a>
            <a href="playlist.html" class="nav-link">PlayList</a>
            <a href="cgpa-calculator.html" class="nav-link cgpa-orange">CGPA</a>
            <a href="about.html" class="nav-link">About</a>
        </nav>
        <button id="hamburger" class="icon-btn hamburger" aria-label="Menu" title="Menu"><span></span><span></span><span></span></button>
    </header>

    <main class="container">
        <section class="card">
            <h2>Courses & Classes</h2>
            <div class="courses-filter-interface">
                <div class="filter-row-1">
                    <div class="trimester-filter">
                        <label for="trimesterSelect">Trimester:</label>
                        <select id="trimesterSelect" class="trimester-select">
                            <option value="all" selected>All</option>
                            <option value="1">1st</option>
                            <option value="2">2nd</option>
                            <option value="3">3rd</option>
                            <option value="4">4th</option>
                            <option value="5">5th</option>
                            <option value="6">6th</option>
                            <option value="7">7th</option>
                            <option value="8">8th</option>
                            <option value="9">9th</option>
                            <option value="10">10th</option>
                            <option value="11">11th</option>
                            <option value="12">12th</option>
                        </select>
                    </div>
                    <div class="more-filter">
                        <label for="moreSelect">More:</label>
                        <select id="moreSelect" class="more-select">
                            <option value="all" selected>All</option>
                            <option value="major">Major</option>
                            <option value="ged">GED</option>
                            <option value="lab">Lab</option>
                            <option value="fydp">FYDP</option>
                        </select>
                    </div>
                </div>
                <div class="filter-row-2">
                    <input type="text" id="courseSearchInput" class="search-input" placeholder="Search courses..." aria-label="Search courses">
                    <div id="advanceFilter" class="advance-filter" style="display:none;">
                        <label for="advanceSelect">Major:</label>
                        <select id="advanceSelect" class="advance-input">
                            <option value="all" selected>All Majors</option>
                            <option value="computational-theory">Computational Theory</option>
                            <option value="systems">Systems</option>
                            <option value="network-communications">Network & Communications</option>
                            <option value="software">Software</option>
                            <option value="data-science">Data Science</option>
                            <option value="ict">ICT</option>
                        </select>
                    </div>
                    <button id="resetAllSearch" class="search-reset btn" type="button" aria-label="Reset all filters" title="Reset All">RESET</button>
                </div>
            </div>
            <!-- Removed duplicate course search bar -->
            <div class="list" id="coursesList" style="margin-top:10px;">
                <!-- Restored full course list for all trimesters -->
                <!-- Major: Computational Theory Electives -->
                <!-- Major: Systems Electives -->
                <!-- Major: Network Electives -->
                <!-- Major: Software Electives -->
                <!-- Major: Data Science Electives -->
                <!-- Major: Information and Communication Technology Electives -->
                <!-- Major: Computational Theory Electives -->
                <!-- Course list will be rendered dynamically by JS -->
                <div id="courseListContainer"></div>
            </div>
            <div id="noCoursesMsg" class="no-results" hidden>No courses match your search.</div>
            <button id="showAllCoursesBtn" class="btn center-btn" type="button">Show All Courses</button>
            <button id="seeLessCoursesBtn" class="btn center-btn" style="display:none;" type="button">See Less</button>
        </section>
    </main>

    <footer class="footer">
        <p>© <span id="year"></span> Perahin UIU · developed by <a class="no-underline" href="https://github.com/sabbirOG" target="_blank" rel="noopener"><strong>Sabbir Ahmed</strong></a> for the UIU student community</p>
    </footer>

    <script src="../js/coursesData.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/courses.js"></script>
</body>
</html>
