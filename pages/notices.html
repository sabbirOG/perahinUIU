<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notices · Perahin UIU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/notices.css">
    <link rel="icon" href="../logo/logo-perahin-uiu-main.png">
    <meta name="theme-color" content="#FF6F00">
</head>
<body>
    <div class="background-wrapper"></div>
    <header class="topbar">
        <button id="backButton" class="icon-btn back-btn" aria-label="Back" title="Back"><span class="back-chev">‹</span></button>
        <a class="brand no-underline" href="../index.html">
            <img src="../logo/logo-perahin-uiu-main.png" alt="Perahin UIU" class="brand-logo">
            <span class="brand-name"><span class="brand-text">perahin</span><span class="brand-uiu">UIU</span></span>
        </a>
        <nav class="nav" id="navMenu">
            <a href="../index.html" class="nav-link">Dashboard</a>
            <a href="courses.html" class="nav-link">Courses</a>
            <a href="notices.html" class="nav-link active">Notices</a>
            <a href="events.html" class="nav-link">Events</a>
            <a href="messages.html" class="nav-link">Messages</a>
            <a href="resources.html" class="nav-link">Resources</a>
            <a href="playlist.html" class="nav-link">PlayList</a>
            <a href="cgpa-calculator.html" class="nav-link cgpa-orange">CGPA</a>
            <a href="about.html" class="nav-link">About</a>
        </nav>
        <button id="hamburger" class="icon-btn hamburger" aria-label="Menu" title="Menu"><span></span><span></span><span></span></button>
    </header>

    <main class="container">
        <div class="card" style="margin-bottom: 12px;">
            <p class="muted" style="margin: 0 0 8px;">Use Notices for official university announcements.</p>
            <div class="grid cols-3">
                <input id="noticeSearch" class="input" type="text" placeholder="Search notices..." aria-label="Search notices">
                <select id="noticeCategory" class="input" aria-label="Filter by category">
                    <option value="all">All categories</option>
                    <option value="important">Important</option>
                    <option value="general">General</option>
                </select>
                <select id="noticeDate" class="input" aria-label="Filter by month">
                    <option value="all">Any month</option>
                    <option value="01">Jan</option>
                    <option value="02">Feb</option>
                    <option value="03">Mar</option>
                    <option value="04">Apr</option>
                    <option value="05">May</option>
                    <option value="06">Jun</option>
                    <option value="07">Jul</option>
                    <option value="08">Aug</option>
                    <option value="09">Sep</option>
                    <option value="10">Oct</option>
                    <option value="11">Nov</option>
                    <option value="12">Dec</option>
                </select>
            </div>
        </div>

        <section class="grid cols-2" id="noticesList">
            <!-- Notice cards will be rendered here by JS -->
        </section>
    </main>

    <footer class="footer">
        <p>© <span id="year"></span> Perahin UIU · developed by <a class="no-underline" href="https://github.com/sabbirOG" target="_blank" rel="noopener"><strong>Sabbir Ahmed</strong></a> for the UIU student community</p>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/noticesData.js"></script>
    <script src="../js/notices.js"></script>
</body>
</html>
