<svg width="300" height="400" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Calculator Body Shadow -->
  <ellipse cx="150" cy="390" rx="120" ry="15" fill="#000000" opacity="0.1"/>
  
  <!-- Calculator Body -->
  <rect x="40" y="20" width="220" height="360" rx="20" fill="white"/>
  <rect x="40" y="20" width="220" height="360" rx="20" fill="url(#gradient1)" opacity="0.05"/>
  
  <!-- Calculator Border -->
  <rect x="40" y="20" width="220" height="360" rx="20" stroke="#E0E0E0" stroke-width="2" fill="none"/>
  
  <!-- Display Screen -->
  <rect x="60" y="45" width="180" height="70" rx="10" fill="#F5F5F5"/>
  <rect x="60" y="45" width="180" height="70" rx="10" stroke="#FF6F00" stroke-width="2" fill="none"/>
  
  <!-- Display Text -->
  <text x="220" y="90" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FF6F00" text-anchor="end">4.00</text>
  
  <!-- Button Grid -->
  <!-- Row 1 -->
  <rect x="60" y="135" width="35" height="35" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="77.5" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#666" text-anchor="middle">7</text>
  
  <rect x="105" y="135" width="35" height="35" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="122.5" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#666" text-anchor="middle">8</text>
  
  <rect x="150" y="135" width="35" height="35" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="167.5" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#666" text-anchor="middle">9</text>
  
  <rect x="195" y="135" width="45" height="35" rx="8" fill="#FFF4ED" stroke="#FF6F00" stroke-width="1.5"/>
  <text x="217.5" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FF6F00" text-anchor="middle">÷</text>
  
  <!-- Row 2 -->
  <rect x="60" y="180" width="35" height="35" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="77.5" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#666" text-anchor="middle">4</text>
  
  <rect x="105" y="180" width="35" height="35" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="122.5" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#666" text-anchor="middle">5</text>
  
  <rect x="150" y="180" width="35" height="35" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="167.5" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#666" text-anchor="middle">6</text>
  
  <rect x="195" y="180" width="45" height="35" rx="8" fill="#FFF4ED" stroke="#FF6F00" stroke-width="1.5"/>
  <text x="217.5" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FF6F00" text-anchor="middle">×</text>
  
  <!-- Row 3 -->
  <rect x="60" y="225" width="35" height="35" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="77.5" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#666" text-anchor="middle">1</text>
  
  <rect x="105" y="225" width="35" height="35" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="122.5" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#666" text-anchor="middle">2</text>
  
  <rect x="150" y="225" width="35" height="35" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="167.5" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#666" text-anchor="middle">3</text>
  
  <rect x="195" y="225" width="45" height="35" rx="8" fill="#FFF4ED" stroke="#FF6F00" stroke-width="1.5"/>
  <text x="217.5" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FF6F00" text-anchor="middle">−</text>
  
  <!-- Row 4 -->
  <rect x="60" y="270" width="35" height="35" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="77.5" y="295" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#666" text-anchor="middle">0</text>
  
  <rect x="105" y="270" width="35" height="35" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="122.5" y="295" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#666" text-anchor="middle">.</text>
  
  <rect x="150" y="270" width="35" height="35" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="167.5" y="295" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#666" text-anchor="middle">C</text>
  
  <rect x="195" y="270" width="45" height="35" rx="8" fill="#FFF4ED" stroke="#FF6F00" stroke-width="1.5"/>
  <text x="217.5" y="295" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#FF6F00" text-anchor="middle">+</text>
  
  <!-- Equals Button (Large) -->
  <rect x="60" y="320" width="180" height="40" rx="10" fill="#FF6F00"/>
  <rect x="60" y="320" width="180" height="40" rx="10" fill="url(#gradient2)" opacity="0.2"/>
  <text x="150" y="347" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">=</text>
  
  <!-- Subtle shine effect on calculator body -->
  <rect x="45" y="25" width="100" height="200" rx="15" fill="url(#shine)" opacity="0.1"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6F00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8F40;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.2" />
    </linearGradient>
    
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Soft shadow on buttons for depth -->
  <filter id="buttonShadow">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
    <feOffset dx="0" dy="2" result="offsetblur"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.2"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</svg>
